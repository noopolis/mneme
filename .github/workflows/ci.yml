name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  commit-message:
    name: Commit messages and author allowlist
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out pull request head with full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Check every pull request commit before install
        run: node .github/scripts/ci/commit-message.mts --range "origin/$GITHUB_BASE_REF..HEAD"
      - name: Test commit policy
        run: |
          mkdir -p .tmp-commit-check
          TMPDIR="$PWD/.tmp-commit-check" node --test .github/scripts/ci/commit-message.test.mts

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

